<section class="page compte">
  <form class="card compte__carte" [formGroup]="form" (ngSubmit)="connecter()" novalidate>
    <h1>Connexion</h1>
    <p class="muted">Parents contributeurs et orthophonistes</p>

    @if (!configure) {
      <p class="compte__erreur" role="alert">Le backend n'est pas encore configuré (voir le README).</p>
    }

    <label class="field" [class.field--error]="form.controls.email.touched && form.controls.email.invalid">
      <span class="field__label">Adresse e-mail</span>
      <input class="field__input" type="email" formControlName="email" autocomplete="email" placeholder="nom@exemple.tn" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field__error">Entrez une adresse e-mail valide.</span>
      }
    </label>

    <label class="field" [class.field--error]="form.controls.motDePasse.touched && form.controls.motDePasse.invalid">
      <span class="field__label">Mot de passe</span>
      <input class="field__input" type="password" formControlName="motDePasse" autocomplete="current-password" />
      @if (form.controls.motDePasse.touched && form.controls.motDePasse.invalid) {
        <span class="field__error">Entrez votre mot de passe.</span>
      }
    </label>

    @if (erreur(); as e) {
      <p class="compte__erreur" role="alert">{{ e }}</p>
    }

    <button type="submit" class="btn btn--primary" [disabled]="envoi() || !configure">
      {{ envoi() ? 'Connexion…' : 'Se connecter' }}
    </button>

    <hr />
    <p class="muted">Pas encore de compte ?</p>
    <a routerLink="/inscription" [queryParams]="suite() ? { suite: suite() } : {}" class="btn">Créer un compte parent</a>

    <p class="compte__info">
      <strong>Vous êtes orthophoniste partenaire ?</strong><br />
      Votre compte est activé par l'équipe Nahki.
    </p>
  </form>
</section>
